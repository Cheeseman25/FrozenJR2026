<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Frozen JR. Production Portal & Call Board</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            frozen: {
              50: '#f0f9ff',
              100: '#e0f2fe',
              200: '#bae6fd',
              400: '#38bdf8',
              500: '#0ea5e9',
              600: '#0284c7',
              800: '#075985',
              900: '#0c4a6e',
              950: '#082f49',
            }
          }
        }
      }
    }
  </script>

  <!-- React 18 & Babel for Browser Execution -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Nunito:wght@400;600;700;800&display=swap');
    body {
      font-family: 'Nunito', sans-serif;
      background: radial-gradient(circle at 50% 0%, #0c4a6e 0%, #031828 100%);
      color: #f1f5f9;
      min-height: 100vh;
    }
    .font-cinzel { font-family: 'Cinzel', serif; }
    .glass-card {
      background: rgba(15, 23, 42, 0.75);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(56, 189, 248, 0.2);
    }
    .glass-card-active {
      border-color: rgba(56, 189, 248, 0.55);
      box-shadow: 0 0 25px rgba(56, 189, 248, 0.15);
    }
    /* Custom Scrollbar */
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: #082f49; }
    ::-webkit-scrollbar-thumb { background: #0284c7; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #38bdf8; }
  </style>
</head>
<body class="selection:bg-cyan-500 selection:text-white pb-20">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef, useMemo } = React;

    // --- Production Master Integrations ---
    const CALENDAR_ID = "49b5ea63eac530c59fd5465d1fbbe1fd385a2235e24910c4a95371c07b95b5ab@group.calendar.google.com";
    const CAST_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRruIC2zvcxRfRrtKsgZmHoVOEsiJVEsY7wqRcZzpEkXlMA6_ASTsidzCGrdkp0_7Dt5247cCYCcXSJ/pub?gid=1788082919&single=true&output=csv";
    const YOUTUBE_REHEARSAL_PLAYLIST_ID = "PLBDCgs4SWfnF2517NHRg4gLkayKkYssJb";

    // Live Google Apps Script Web App Backend URL
    const CALLBOARD_BACKEND_URL = "https://script.google.com/macros/s/AKfycbyof6K9TWBjXsSBevpx6hmk3VZ1971ob7jmng1Bo3piJiRQLujKPx7wLyyhqep8R_wn/exec";

    // Helper: Universal Clickable Link Renderer for text fields
    function renderWithLinks(text) {
      if (!text || typeof text !== 'string') return text;
      const urlRegex = /(https?:\/\/[^\s]+|meet\.google\.com\/[a-zA-Z0-9_-]+)/g;
      const parts = text.split(urlRegex);
      return parts.map((part, i) => {
        if (part && (part.match(/^https?:\/\//) || part.match(/^meet\.google\.com/))) {
          const href = part.startsWith('http') ? part : `https://${part}`;
          return (
            <a
              key={i}
              href={href}
              target="_blank"
              rel="noopener noreferrer"
              className="text-cyan-300 hover:text-cyan-100 underline decoration-cyan-400 font-semibold break-all inline-flex items-center gap-0.5"
            >
              <span>{part}</span>
              <span className="text-[10px] no-underline">↗</span>
            </a>
          );
        }
        return part;
      });
    }

    // Helper: Fixed CSV Parser that safely handles apostrophes in names (e.g. O'Sullivan)
    function parseCSV(text) {
      const lines = text.trim().split(/\r?\n/).filter(line => line.trim().length > 0);
      if (lines.length < 2) return [];

      function parseRow(rowStr) {
        const result = [];
        let cur = '';
        let inQuotes = false;
        for (let i = 0; i < rowStr.length; i++) {
          const char = rowStr[i];
          // Standard CSV only escapes via double quotes ("), not single quotes (')
          if (char === '"') {
            inQuotes = !inQuotes;
          } else if (char === ',' && !inQuotes) {
            result.push(cur.trim().replace(/^"|"$/g, ''));
            cur = '';
          } else {
            cur += char;
          }
        }
        result.push(cur.trim().replace(/^"|"$/g, ''));
        return result;
      }

      const headers = parseRow(lines[0]).map(h => (h || '').toLowerCase().trim());

      const catIdx = headers.findIndex(h => h.includes('cat') || h.includes('type') || h.includes('group') || h.includes('tier'));
      const roleIdx = headers.findIndex(h => h.includes('role') || h.includes('character') || h.includes('part'));
      const summerIdx = headers.findIndex(h => h.includes('summer') || h.includes('snow') || h.includes('cast a') || h.includes('cast 1'));
      const winterIdx = headers.findIndex(h => h.includes('winter') || h.includes('ice') || h.includes('cast b') || h.includes('cast 2'));

      const effectiveCatCol = catIdx !== -1 ? catIdx : 0;
      const effectiveRoleCol = roleIdx !== -1 ? roleIdx : 1;
      const effectiveSummerCol = summerIdx !== -1 ? summerIdx : 2;
      const effectiveWinterCol = winterIdx !== -1 ? winterIdx : 3;

      return lines.slice(1).map((line, rowIdx) => {
        const cols = parseRow(line);
        const category = cols[effectiveCatCol] || 'Company';
        const role = cols[effectiveRoleCol] || `Role #${rowIdx + 1}`;
        const castSummer = cols[effectiveSummerCol] || 'TBD';
        const castWinter = cols[effectiveWinterCol] || castSummer || 'TBD';

        const isFeaturedEnsemble = category.toLowerCase().includes('featured ensemble') || 
                                   role.toLowerCase().includes('featured ensemble');

        const isChorus = !isFeaturedEnsemble && (
                         category.toLowerCase().includes('chorus') || 
                         category.toLowerCase().includes('ensemble') || 
                         role.toLowerCase().includes('chorus') || 
                         role.toLowerCase().includes('ensemble'));

        return {
          id: 'role-' + rowIdx,
          category,
          role,
          castSummer: castSummer || 'TBD',
          castWinter: castWinter || 'TBD',
          isFeaturedEnsemble,
          isChorus
        };
      }).filter(item => item.role.trim().length > 0 && item.role.toLowerCase() !== 'role');
    }

    const INITIAL_CALL_TYPES = [
      'Saturday Company (Full Cast)',
      'Wednesday Partial Call',
      'Parent Meeting',
      'Principals Vocal Clinic',
      'Choreography Blocking',
      'Music & Harmonies',
      'Tech / Dress Rehearsal'
    ];

    const TAB_INFO = {
      callboard: { label: 'Call Board & Schedule', icon: '📅', path: 'callboard' },
      cast: { label: 'Summer & Winter Cast List', icon: '🎭', path: 'cast' },
      music: { label: 'Rehearsal Tracks', icon: '🎵', path: 'music' },
      videos: { label: 'Choreography Vault', icon: '🎬', path: 'videos' },
      calendar: { label: 'Master Calendar', icon: '🗓️', path: 'calendar' }
    };

    function ProductionApp() {
      const getInitialTab = () => {
        const hash = window.location.hash.replace('#', '').toLowerCase();
        return TAB_INFO[hash] ? hash : 'callboard';
      };

      const [activeTab, setActiveTab] = useState(getInitialTab);
      const [copiedBreadcrumb, setCopiedBreadcrumb] = useState(false);

      const [isAdmin, setIsAdmin] = useState(false);
      const [showLoginModal, setShowLoginModal] = useState(false);
      const [adminPinInput, setAdminPinInput] = useState('');
      const [adminPinError, setAdminPinError] = useState('');
      const [adminPin] = useState('1234');

      // Live Google Sheet Cast State
      const [castList, setCastList] = useState([]);
      const [isLoadingCast, setIsLoadingCast] = useState(true);
      const [castError, setCastError] = useState(null);
      const [selectedCastGroup, setSelectedCastGroup] = useState('ALL');
      const [castFilterQuery, setCastFilterQuery] = useState('');

      // Call Types (with write-ins saved)
      const [callTypes, setCallTypes] = useState(() => {
        const saved = localStorage.getItem('frozen_call_types');
        return saved ? JSON.parse(saved) : INITIAL_CALL_TYPES;
      });

      // Rehearsals State
      const [rehearsals, setRehearsals] = useState(() => {
        const saved = localStorage.getItem('frozen_rehearsals');
        return saved ? JSON.parse(saved) : [];
      });
      const [backendStatus, setBackendStatus] = useState('Checking connection...');
      const [callSearchRole, setCallSearchRole] = useState('');

      // Admin Modal State
      const [isEditingCall, setIsEditingCall] = useState(false);
      const [editCallData, setEditCallData] = useState({
        id: '',
        title: '',
        date: '',
        time: '',
        location: '',
        type: 'Wednesday Partial Call',
        customType: '',
        calledRoles: [],
        focusScenes: '',
        notes: ''
      });
      const [isCustomTypeMode, setIsCustomTypeMode] = useState(false);

      const navigateToTab = (tabId) => {
        setActiveTab(tabId);
        window.location.hash = tabId;
      };

      useEffect(() => {
        const handleHashChange = () => {
          const hash = window.location.hash.replace('#', '').toLowerCase();
          if (TAB_INFO[hash]) {
            setActiveTab(hash);
          }
        };
        window.addEventListener('hashchange', handleHashChange);
        return () => window.removeEventListener('hashchange', handleHashChange);
      }, []);

      const copyCurrentBreadcrumbLink = () => {
        const url = window.location.origin + window.location.pathname + '#' + activeTab;
        navigator.clipboard.writeText(url).then(() => {
          setCopiedBreadcrumb(true);
          setTimeout(() => setCopiedBreadcrumb(false), 2000);
        });
      };

      // Fetch Live Cast from Google Sheets CSV
      const loadLiveCast = async () => {
        setIsLoadingCast(true);
        setCastError(null);
        try {
          const res = await fetch(`${CAST_CSV_URL}&t=${Date.now()}`);
          if (!res.ok) throw new Error("Could not fetch Google Sheet data.");
          const text = await res.text();
          const parsed = parseCSV(text);
          if (parsed.length > 0) {
            setCastList(parsed);
          } else {
            setCastError("Spreadsheet returned no data rows yet.");
          }
        } catch (err) {
          console.error(err);
          setCastError("Could not connect to Google Sheet. Check network connection or publish settings.");
        } finally {
          setIsLoadingCast(false);
        }
      };

      // Fetch Live Rehearsals from Google Sheet Backend
      const fetchBackendRehearsals = async () => {
        if (!CALLBOARD_BACKEND_URL) return;
        try {
          const res = await fetch(`${CALLBOARD_BACKEND_URL}?t=${Date.now()}`);
          const data = await res.json();
          if (Array.isArray(data)) {
            const formatted = data.map(item => ({
              ...item,
              calledRoles: typeof item.calledRoles === 'string' ? item.calledRoles.split(',').map(s=>s.trim()).filter(Boolean) : (item.calledRoles || []),
              focusScenes: typeof item.focusScenes === 'string' ? item.focusScenes.split(',').map(s=>s.trim()).filter(Boolean) : (item.focusScenes || [])
            }));
            setRehearsals(formatted);
            localStorage.setItem('frozen_rehearsals', JSON.stringify(formatted));
            setBackendStatus('Connected to Google Sheet');
          }
        } catch (e) {
          console.log('Backend sync offline, using local storage.');
          setBackendStatus('Offline / Local Storage Mode');
        }
      };

      useEffect(() => {
        loadLiveCast();
        fetchBackendRehearsals();
      }, []);

      useEffect(() => {
        localStorage.setItem('frozen_rehearsals', JSON.stringify(rehearsals));
      }, [rehearsals]);

      useEffect(() => {
        localStorage.setItem('frozen_call_types', JSON.stringify(callTypes));
      }, [callTypes]);

      const handleLogin = (e) => {
        e.preventDefault();
        if (adminPinInput === adminPin) {
          setIsAdmin(true);
          setShowLoginModal(false);
          setAdminPinInput('');
          setAdminPinError('');
        } else {
          setAdminPinError('Invalid PIN. Contact Stage Management.');
        }
      };

      const openAddCall = () => {
        setEditCallData({
          id: 'reh-' + Date.now(),
          title: '',
          date: new Date().toISOString().split('T')[0],
          time: '',
          location: '',
          type: callTypes[0] || 'Wednesday Partial Call',
          customType: '',
          calledRoles: [],
          focusScenes: '',
          notes: ''
        });
        setIsCustomTypeMode(false);
        setIsEditingCall(true);
      };

      const openEditCall = (reh) => {
        setEditCallData({
          ...reh,
          customType: '',
          calledRoles: Array.isArray(reh.calledRoles) ? reh.calledRoles : (reh.calledRoles ? [reh.calledRoles] : []),
          focusScenes: Array.isArray(reh.focusScenes) ? reh.focusScenes.join(', ') : (reh.focusScenes || '')
        });
        setIsCustomTypeMode(!callTypes.includes(reh.type));
        setIsEditingCall(true);
      };

      const toggleCalledRole = (roleTag) => {
        const cur = [...editCallData.calledRoles];
        const idx = cur.indexOf(roleTag);
        if (idx > -1) {
          cur.splice(idx, 1);
        } else {
          cur.push(roleTag);
        }
        setEditCallData({ ...editCallData, calledRoles: cur });
      };

      const selectAllGroup = (groupType) => {
        let tags = [];
        if (groupType === 'ALL_SUMMER') {
          tags = castList.filter(c => !c.isFeaturedEnsemble).map(c => c.isChorus ? `${c.role} (Both Casts)` : `${c.role} (Summer Cast)`);
        } else if (groupType === 'ALL_WINTER') {
          tags = castList.filter(c => !c.isFeaturedEnsemble).map(c => c.isChorus ? `${c.role} (Both Casts)` : `${c.role} (Winter Cast)`);
        } else if (groupType === 'FULL_COMPANY') {
          tags = ['Full Cast & Company (All Members)'];
        } else if (groupType === 'ALL_CHORUS') {
          tags = castList.filter(c => c.isChorus).map(c => `${c.role} (Both Casts)`);
        } else if (groupType === 'ALL_FEATURED') {
          tags = castList.filter(c => c.isFeaturedEnsemble).map(c => `${c.role} (Featured Ensemble)`);
        }
        const merged = Array.from(new Set([...editCallData.calledRoles, ...tags]));
        setEditCallData({ ...editCallData, calledRoles: merged });
      };

      const clearAllRoles = () => {
        setEditCallData({ ...editCallData, calledRoles: [] });
      };

      // Save rehearsal call & post to Google Sheet backend
      const saveCall = async (e) => {
        e.preventDefault();

        let finalType = editCallData.type;
        if (isCustomTypeMode && editCallData.customType.trim()) {
          finalType = editCallData.customType.trim();
          if (!callTypes.includes(finalType)) {
            setCallTypes(prev => [...prev, finalType]);
          }
        }

        const sceneArray = typeof editCallData.focusScenes === 'string'
          ? editCallData.focusScenes.split(',').map(s => s.trim()).filter(Boolean)
          : editCallData.focusScenes;

        const newEntry = {
          ...editCallData,
          type: finalType,
          calledRoles: editCallData.calledRoles,
          focusScenes: sceneArray
        };

        const existingIndex = rehearsals.findIndex(r => r.id === newEntry.id);
        let updated = [];
        if (existingIndex > -1) {
          updated = [...rehearsals];
          updated[existingIndex] = newEntry;
        } else {
          updated = [...rehearsals, newEntry].sort((a, b) => new Date(a.date) - new Date(b.date));
        }

        setRehearsals(updated);
        localStorage.setItem('frozen_rehearsals', JSON.stringify(updated));
        setIsEditingCall(false);

        if (CALLBOARD_BACKEND_URL) {
          try {
            await fetch(CALLBOARD_BACKEND_URL, {
              method: 'POST',
              headers: { 'Content-Type': 'text/plain;charset=utf-8' },
              body: JSON.stringify({ action: 'save', item: newEntry })
            });
            console.log('Successfully saved to Google Sheet database.');
          } catch (err) {
            console.error('Error posting to Google Sheet backend', err);
          }
        }
      };

      const deleteCall = async (id) => {
        if (confirm("Delete this rehearsal call notice?")) {
          const updated = rehearsals.filter(r => r.id !== id);
          setRehearsals(updated);
          localStorage.setItem('frozen_rehearsals', JSON.stringify(updated));

          if (CALLBOARD_BACKEND_URL) {
            try {
              await fetch(CALLBOARD_BACKEND_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                body: JSON.stringify({ action: 'delete', id })
              });
            } catch (err) {
              console.error('Error sending delete to backend', err);
            }
          }
        }
      };

      const filteredRehearsals = useMemo(() => {
        if (!callSearchRole.trim()) return rehearsals;
        const query = callSearchRole.toLowerCase();
        return rehearsals.filter(r => {
          const inRoles = Array.isArray(r.calledRoles) && r.calledRoles.some(role => role.toLowerCase().includes(query) || role.toLowerCase().includes('full cast') || role.toLowerCase().includes('company'));
          const inTitle = r.title && r.title.toLowerCase().includes(query);
          return inRoles || inTitle;
        });
      }, [rehearsals, callSearchRole]);

      const { mainCast, featuredEnsembleCast } = useMemo(() => {
        const q = castFilterQuery.toLowerCase();
        const filtered = castList.filter(item => 
          item.role.toLowerCase().includes(q) ||
          item.castSummer.toLowerCase().includes(q) ||
          item.castWinter.toLowerCase().includes(q) ||
          item.category.toLowerCase().includes(q)
        );

        return {
          mainCast: filtered.filter(item => !item.isFeaturedEnsemble),
          featuredEnsembleCast: filtered.filter(item => item.isFeaturedEnsemble)
        };
      }, [castList, castFilterQuery]);

      return (
        <div className="max-w-6xl mx-auto px-4 py-6">
          {/* Header Banner */}
          <header className="flex flex-col md:flex-row items-center justify-between gap-4 border-b border-cyan-500/20 pb-6 mb-4">
            <div className="flex items-center gap-4 text-center md:text-left">
              <div className="w-16 h-16 rounded-2xl bg-gradient-to-tr from-cyan-600 to-sky-300 flex items-center justify-center text-white text-3xl shadow-lg shadow-cyan-500/30">
                ❄️
              </div>
              <div>
                <span className="text-xs uppercase tracking-widest text-cyan-400 font-bold bg-cyan-950/80 px-2.5 py-1 rounded-full border border-cyan-700/50">
                  Cast & Crew Portal
                </span>
                <h1 className="text-3xl md:text-4xl font-extrabold font-cinzel text-transparent bg-clip-text bg-gradient-to-r from-sky-100 via-cyan-200 to-blue-300 tracking-wide mt-1">
                  FROZEN JR.
                </h1>
                <p className="text-xs md:text-sm text-cyan-200/70">
                  Rehearsal Call Board • Tracks • Live Summer & Winter Cast Hub
                </p>
              </div>
            </div>

            <div className="flex items-center gap-3">
              {isAdmin ? (
                <div className="flex items-center gap-3 bg-emerald-950/80 border border-emerald-500/50 text-emerald-200 px-4 py-2 rounded-xl text-xs md:text-sm font-semibold">
                  <span className="inline-block w-2.5 h-2.5 rounded-full bg-emerald-400 animate-pulse"></span>
                  Director / Crew Admin
                  <button 
                    onClick={() => setIsAdmin(false)}
                    className="ml-2 text-emerald-400 hover:text-white underline text-xs">
                    Lock
                  </button>
                </div>
              ) : (
                <button 
                  onClick={() => setShowLoginModal(true)}
                  className="flex items-center gap-2 bg-slate-800/90 hover:bg-slate-700 border border-cyan-500/30 text-cyan-200 px-4 py-2 rounded-xl text-xs md:text-sm font-semibold transition">
                  <svg className="w-4 h-4 text-cyan-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/></svg>
                  Staff Login
                </button>
              )}
            </div>
          </header>

          {/* URL Breadcrumb Navigator Bar */}
          <div className="flex items-center justify-between py-2 px-3 mb-4 rounded-xl bg-slate-950/60 border border-cyan-950 text-xs">
            <div className="flex items-center gap-1.5 text-slate-400">
              <span className="text-cyan-400">❄️ Frozen JR</span>
              <span>/</span>
              <span className="text-slate-300 font-semibold">{TAB_INFO[activeTab]?.icon} {TAB_INFO[activeTab]?.label}</span>
              <span className="hidden sm:inline font-mono text-[11px] text-cyan-500/70">#{activeTab}</span>
            </div>

            <button
              onClick={copyCurrentBreadcrumbLink}
              className="flex items-center gap-1 text-[11px] font-semibold text-cyan-300 hover:text-white bg-slate-900 hover:bg-slate-800 px-2.5 py-1 rounded-lg border border-cyan-900 transition"
              title="Copy direct link to this page"
            >
              <span>{copiedBreadcrumb ? '✓ Copied Link!' : '🔗 Copy Direct Link'}</span>
            </button>
          </div>

          {/* Navigation Bar */}
          <nav className="flex flex-wrap items-center gap-2 mb-8 bg-slate-900/60 p-1.5 rounded-2xl border border-cyan-900/50 backdrop-blur-md">
            {Object.keys(TAB_INFO).map(key => {
              const tab = TAB_INFO[key];
              return (
                <button
                  key={key}
                  onClick={() => navigateToTab(key)}
                  className={`flex items-center gap-2 px-4 py-2.5 rounded-xl font-bold text-xs md:text-sm transition-all duration-200 flex-1 md:flex-initial text-center justify-center ${
                    activeTab === key
                      ? 'bg-gradient-to-r from-cyan-600 to-sky-600 text-white shadow-md shadow-cyan-900/50'
                      : 'text-slate-300 hover:text-white hover:bg-slate-800/60'
                  }`}
                >
                  <span>{tab.icon}</span>
                  <span>{tab.label}</span>
                </button>
              );
            })}
          </nav>

          {/* ======================================================== */}
          {/* TAB 1: CALL BOARD & REHEARSAL CALLS                      */}
          {/* ======================================================== */}
          {activeTab === 'callboard' && (
            <div className="space-y-6">
              <div className="glass-card p-5 rounded-2xl flex flex-col md:flex-row items-center justify-between gap-4">
                <div className="w-full md:w-auto flex-1">
                  <div className="relative">
                    <input 
                      type="text"
                      placeholder="Filter by character or cast (e.g., Elsa, Summer Cast, Chorus)..."
                      value={callSearchRole}
                      onChange={(e) => setCallSearchRole(e.target.value)}
                      className="w-full bg-slate-950/70 border border-cyan-800/70 rounded-xl px-4 py-2.5 text-sm text-cyan-100 placeholder-slate-400 focus:outline-none focus:border-cyan-400"
                    />
                    {callSearchRole && (
                      <button 
                        onClick={() => setCallSearchRole('')}
                        className="absolute right-3 top-2.5 text-xs text-slate-400 hover:text-white">
                        Clear
                      </button>
                    )}
                  </div>
                  <div className="flex items-center gap-3 text-xs text-slate-400 mt-2">
                    <span>💡 Wednesday calls target specific scenes based on Saturday notes.</span>
                    <span className="text-emerald-400 font-semibold flex items-center gap-1">
                      ● {backendStatus}
                    </span>
                  </div>
                </div>

                {isAdmin && (
                  <div className="flex flex-wrap items-center gap-3 w-full md:w-auto">
                    <button
                      onClick={openAddCall}

                  </div>
                </div>

                <div className="aspect-[4/3] md:aspect-[16/9] w-full rounded-2xl overflow-hidden border border-cyan-800/50 bg-slate-950 shadow-inner">
                  <iframe
                    src={`https://calendar.google.com/calendar/embed?src=${encodeURIComponent(CALENDAR_ID)}&ctz=America%2FNew_York`}
                    style={{ border: 0 }}
                    width="100%"
                    height="100%"
                    frameBorder="0"
                    scrolling="no"
                    title="Frozen JR Production Calendar"
                  ></iframe>
                </div>

                <div className="mt-4 flex items-center justify-between text-xs text-slate-400">
                  <span>⏰ Displaying America/New York time zone</span>
                  <span className="text-cyan-300 font-medium">Auto-updates across devices</span>
                </div>
              </div>
            </div>
          )}

          {/* ======================================================== */}
          {/* MODAL: ADMIN LOGIN                                       */}
          {/* ======================================================== */}
          {showLoginModal && (
            <div className="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="glass-card max-w-sm w-full p-6 rounded-3xl border border-cyan-500/40 shadow-2xl relative">
                <button 
                  onClick={() => setShowLoginModal(false)}
                  className="absolute top-4 right-4 text-slate-400 hover:text-white text-lg">
                  ✕
                </button>
                <div className="text-center mb-5">
                  <div className="w-12 h-12 bg-cyan-950 border border-cyan-500 rounded-2xl flex items-center justify-center text-2xl mx-auto mb-2 text-cyan-300">
                    🔒
                  </div>
                  <h3 className="text-lg font-bold font-cinzel text-white">Production Staff Access</h3>
                  <p className="text-xs text-slate-400">Enter crew PIN to post & edit rehearsal calls</p>
                </div>

                <form onSubmit={handleLogin} className="space-y-4">
                  <div>
                    <input 
                      type="password"
                      placeholder="Enter Access PIN (Default: 1234)"
                      value={adminPinInput}
                      onChange={(e) => setAdminPinInput(e.target.value)}
                      autoFocus
                      className="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-center text-lg font-mono tracking-widest text-cyan-300 focus:outline-none focus:border-cyan-400"
                    />
                    {adminPinError && (
                      <p className="text-red-400 text-xs mt-1.5 text-center">{adminPinError}</p>
                    )}
                  </div>
                  <button 
                    type="submit"
                    className="w-full bg-gradient-to-r from-cyan-600 to-sky-500 hover:from-cyan-500 hover:to-sky-400 text-slate-950 font-black py-2.5 rounded-xl text-sm transition shadow-lg shadow-cyan-600/30">
                    Unlock Admin Tools
                  </button>
                </form>
              </div>
            </div>
          )}

          {/* ======================================================== */}
          {/* MODAL: POST / EDIT REHEARSAL CALL WITH ADVANCED PICKER   */}
          {/* ======================================================== */}
          {isEditingCall && (
            <div className="fixed inset-0 z-50 bg-slate-950/85 backdrop-blur-sm flex items-center justify-center p-4 overflow-y-auto">
              <div className="glass-card max-w-2xl w-full p-6 rounded-3xl border border-cyan-500/50 shadow-2xl my-8">
                <div className="flex items-center justify-between pb-3 border-b border-slate-700/60 mb-4">
                  <h3 className="text-lg font-bold font-cinzel text-white">
                    {editCallData.id ? 'Publish / Edit Rehearsal Call' : 'New Rehearsal Call'}
                  </h3>
                  <button onClick={() => setIsEditingCall(false)} className="text-slate-400 hover:text-white">✕</button>
                </div>

                <form onSubmit={saveCall} className="space-y-4 text-xs">
                  <div>
                    <label className="block text-slate-300 font-bold mb-1">Notice Headline</label>
                    <input 
                      type="text"
                      required
                      value={editCallData.title}
                      onChange={(e) => setEditCallData({...editCallData, title: e.target.value})}
                      placeholder="e.g., Wednesday Vocal & Staging Clinic"
                      className="w-full bg-slate-900 border border-slate-700 rounded-xl p-2.5 text-white"
                    />
                  </div>

                  <div className="grid grid-cols-1 md:grid-cols-2 gap-3">
                    <div>
                      <label className="block text-slate-300 font-bold mb-1">Rehearsal Date</label>
                      <input 
                        type="date"
                        required
                        value={editCallData.date}
                        onChange={(e) => setEditCallData({...editCallData, date: e.target.value})}
                        className="w-full bg-slate-900 border border-slate-700 rounded-xl p-2.5 text-white"
                      />
                    </div>

                    <div>
                      <div className="flex items-center justify-between mb-1">
                        <label className="text-slate-300 font-bold">Call Type</label>
                        <button
                          type="button"
                          onClick={() => setIsCustomTypeMode(!isCustomTypeMode)}
                          className="text-[11px] text-cyan-400 hover:underline"
                        >
                          {isCustomTypeMode ? "← Choose from list" : "+ Custom Call Type"}
                        </button>
                      </div>

                      {isCustomTypeMode ? (
                        <input
                          type="text"
                          required
                          value={editCallData.customType}
                          onChange={(e) => setEditCallData({...editCallData, customType: e.target.value})}
                          placeholder="Type custom call category (e.g. Tap Intensive)"
                          className="w-full bg-slate-900 border border-cyan-500 rounded-xl p-2.5 text-cyan-200 font-semibold"
                        />
                      ) : (
                        <select 
                          value={editCallData.type}
                          onChange={(e) => setEditCallData({...editCallData, type: e.target.value})}
                          className="w-full bg-slate-900 border border-slate-700 rounded-xl p-2.5 text-white font-medium"
                        >
                          {callTypes.map((type, idx) => (
                            <option key={idx} value={type}>{type}</option>
                          ))}
                        </select>
                      )}
                    </div>
                  </div>

                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className="block text-slate-300 font-bold mb-1">Time Block</label>
                      <input 
                        type="text"
                        value={editCallData.time}
                        onChange={(e) => setEditCallData({...editCallData, time: e.target.value})}
                        placeholder="e.g., 5:30 PM - 8:00 PM"
                        className="w-full bg-slate-900 border border-slate-700 rounded-xl p-2.5 text-white"
                      />
                    </div>
                    <div>
                      <label className="block text-slate-300 font-bold mb-1">Room / Location (URLs work here)</label>
                      <input 
                        type="text"
                        value={editCallData.location}
                        onChange={(e) => setEditCallData({...editCallData, location: e.target.value})}
                        placeholder="e.g., Main Stage or https://meet.google.com/..."
                        className="w-full bg-slate-900 border border-slate-700 rounded-xl p-2.5 text-white"
                      />
                    </div>
                  </div>

                  {/* MULTI-SELECT CHARACTER LIST WITH GRANULAR SUMMER / WINTER / FEATURED CAST TOGGLES */}
                  <div className="bg-slate-950/70 p-3.5 rounded-2xl border border-slate-800 space-y-3">
                    <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-2 border-b border-slate-800 pb-2">
                      <div>
                        <label className="block text-cyan-300 font-bold text-sm">Select Who is Called</label>
                        <p className="text-[11px] text-slate-400">Choose Summer Cast, Winter Cast, Both, or Featured Ensemble</p>
                      </div>

                      <div className="flex flex-wrap items-center gap-1.5">
                        <button
                          type="button"
                          onClick={() => selectAllGroup('FULL_COMPANY')}
                          className="bg-cyan-950 hover:bg-cyan-900 text-cyan-300 text-[10px] font-bold px-2 py-1 rounded border border-cyan-800"
                        >
                          + Full Company
                        </button>
                        <button
                          type="button"
                          onClick={() => selectAllGroup('ALL_SUMMER')}
                          className="bg-amber-950 hover:bg-amber-900 text-amber-300 text-[10px] font-bold px-2 py-1 rounded border border-amber-800"
                        >
                          + All Summer
                        </button>
                        <button
                          type="button"
                          onClick={() => selectAllGroup('ALL_WINTER')}
                          className="bg-sky-950 hover:bg-sky-900 text-sky-300 text-[10px] font-bold px-2 py-1 rounded border border-sky-800"
                        >
                          + All Winter
                        </button>
                        <button
                          type="button"
                          onClick={() => selectAllGroup('ALL_CHORUS')}
                          className="bg-emerald-950 hover:bg-emerald-900 text-emerald-300 text-[10px] font-bold px-2 py-1 rounded border border-emerald-800"
                        >
                          + All Chorus
                        </button>
                        <button
                          type="button"
                          onClick={() => selectAllGroup('ALL_FEATURED')}
                          className="bg-purple-950 hover:bg-purple-900 text-purple-300 text-[10px] font-bold px-2 py-1 rounded border border-purple-800"
                        >
                          + Featured Ens
                        </button>
                        <button
                          type="button"
                          onClick={clearAllRoles}
                          className="text-red-400 hover:text-white text-[10px] font-bold px-1.5 py-1"
                        >
                          Clear
                        </button>
                      </div>
                    </div>

                    <div className="max-h-56 overflow-y-auto space-y-2 pr-1">
                      {castList.map((item) => {
                        const summerTag = `${item.role} (Summer Cast)`;
                        const winterTag = `${item.role} (Winter Cast)`;
                        const bothTag = `${item.role} (Both Casts)`;
                        const featuredTag = `${item.role} (Featured Ensemble)`;

                        const isSummerSelected = editCallData.calledRoles.includes(summerTag);
                        const isWinterSelected = editCallData.calledRoles.includes(winterTag);
                        const isBothSelected = editCallData.calledRoles.includes(bothTag);
                        const isFeaturedSelected = editCallData.calledRoles.includes(featuredTag);

                        return (
                          <div key={item.id} className="flex flex-col sm:flex-row sm:items-center justify-between gap-2 p-2 rounded-xl bg-slate-900/80 border border-slate-800/80 hover:border-slate-700">
                            <div>
                              <span className="font-bold text-white text-xs">{item.role}</span>
                              <span className="text-[10px] text-slate-400 ml-2">({item.category})</span>
                            </div>

                            <div className="flex items-center gap-1.5 shrink-0">
                              {item.isFeaturedEnsemble ? (
                                <button
                                  type="button"
                                  onClick={() => toggleCalledRole(featuredTag)}
                                  className={`px-3 py-1 rounded-lg text-xs font-bold transition ${
                                    isFeaturedSelected
                                      ? 'bg-purple-500 text-slate-950 font-black shadow-md'
                                      : 'bg-slate-800 text-purple-300 hover:bg-slate-700'
                                  }`}
                                >
                                  {isFeaturedSelected ? '✓ Called (Featured Ensemble)' : '+ Call Featured'}
                                </button>
                              ) : item.isChorus ? (
                                <button
                                  type="button"
                                  onClick={() => toggleCalledRole(bothTag)}
                                  className={`px-3 py-1 rounded-lg text-xs font-bold transition ${
                                    isBothSelected
                                      ? 'bg-emerald-500 text-slate-950 font-black shadow-md'
                                      : 'bg-slate-800 text-emerald-300 hover:bg-slate-700'
                                  }`}
                                >
                                  {isBothSelected ? '✓ Called (In Both Casts)' : '+ Call Chorus'}
                                </button>
                              ) : (
                                <>
                                  <button
                                    type="button"
                                    onClick={() => {
                                      let cur = [...editCallData.calledRoles];
                                      if (isBothSelected) {
                                        cur = cur.filter(t => t !== bothTag);
                                      } else {
                                        cur = cur.filter(t => t !== summerTag && t !== winterTag);
                                        cur.push(bothTag);
                                      }
                                      setEditCallData({ ...editCallData, calledRoles: cur });
                                    }}
                                    className={`px-2 py-0.5 rounded text-[11px] font-bold transition ${
                                      isBothSelected
                                        ? 'bg-cyan-500 text-slate-950 font-black'
                                        : 'bg-slate-800 text-cyan-300 hover:bg-slate-700'
                                    }`}
                                  >
                                    Both
                                  </button>

                                  <button
                                    type="button"
                                    onClick={() => {
                                      let cur = editCallData.calledRoles.filter(t => t !== bothTag);
                                      if (cur.includes(summerTag)) {
                                        cur = cur.filter(t => t !== summerTag);
                                      } else {
                                        cur.push(summerTag);
                                      }
                                      setEditCallData({ ...editCallData, calledRoles: cur });
                                    }}
                                    className={`px-2 py-0.5 rounded text-[11px] font-bold transition ${
                                      isSummerSelected && !isBothSelected
                                        ? 'bg-amber-500 text-slate-950 font-black'
                                        : 'bg-slate-800 text-amber-300 hover:bg-slate-700'
                                    }`}
                                    title={item.castSummer ? `Summer Actor: ${item.castSummer}` : 'Summer Cast'}
                                  >
                                    ☀️ Summer ({item.castSummer || 'TBD'})
                                  </button>

                                  <button
                                    type="button"
                                    onClick={() => {
                                      let cur = editCallData.calledRoles.filter(t => t !== bothTag);
                                      if (cur.includes(winterTag)) {
                                        cur = cur.filter(t => t !== winterTag);
                                      } else {
                                        cur.push(winterTag);
                                      }
                                      setEditCallData({ ...editCallData, calledRoles: cur });
                                    }}
                                    className={`px-2 py-0.5 rounded text-[11px] font-bold transition ${
                                      isWinterSelected && !isBothSelected
                                        ? 'bg-sky-500 text-slate-950 font-black'
                                        : 'bg-slate-800 text-sky-300 hover:bg-slate-700'
                                    }`}
                                    title={item.castWinter ? `Winter Actor: ${item.castWinter}` : 'Winter Cast'}
                                  >
                                    ❄️ Winter ({item.castWinter || 'TBD'})
                                  </button>
                                </>
                              )}
                            </div>
                          </div>
                        );
                      })}
                    </div>

                    <div className="pt-2 border-t border-slate-800 text-xs">
                      <span className="text-slate-400">Currently Called ({editCallData.calledRoles.length}): </span>
                      <span className="text-cyan-200 font-semibold">
                        {editCallData.calledRoles.length > 0 ? editCallData.calledRoles.join(', ') : 'None'}
                      </span>
                    </div>
                  </div>

                  <div>
                    <label className="block text-slate-300 font-bold mb-1">
                      Focus Scenes / Music <span className="font-normal text-slate-400">(Comma-separated)</span>
                    </label>
                    <input 
                      type="text"
                      value={editCallData.focusScenes}
                      onChange={(e) => setEditCallData({...editCallData, focusScenes: e.target.value})}
                      placeholder='e.g., Scene 4: "In Summer", Act 1 Harmonies'
                      className="w-full bg-slate-900 border border-slate-700 rounded-xl p-2.5 text-white"
                    />
                  </div>

                  <div>
                    <label className="block text-slate-300 font-bold mb-1">Production Notes for Parents/Cast (URLs work here)</label>
                    <textarea 
                      rows="2"
                      value={editCallData.notes}
                      onChange={(e) => setEditCallData({...editCallData, notes: e.target.value})}
                      placeholder="Bring character shoes, water, pencils for blocking notes..."
                      className="w-full bg-slate-900 border border-slate-700 rounded-xl p-2.5 text-white"
                    ></textarea>
                  </div>

                  <div className="flex justify-end gap-3 pt-3 border-t border-slate-800">
                    <button 
                      type="button" 
                      onClick={() => setIsEditingCall(false)}
                      className="px-4 py-2 rounded-xl text-slate-300 hover:bg-slate-800">
                      Cancel
                    </button>
                    <button 
                      type="submit"
                      className="bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-black px-5 py-2 rounded-xl transition shadow-lg shadow-cyan-500/20">
                      Publish to Call Board
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

          <footer className="mt-12 text-center text-xs text-slate-500 border-t border-slate-800/80 pt-6">
            <p>Frozen JR. • Community Youth Theater Production Portal</p>
            <p className="mt-1">Live Cast Sync • Summer & Winter Schedules • Master Calendar • YouTube Rehearsal Vault</p>
          </footer>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<ProductionApp />);
  </script>
</body>
</html>

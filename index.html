  <script type="text/babel">
    const { useState, useEffect, useRef, useMemo } = React;

    // Google Apps Script Web App Backend Gateway
    const CALLBOARD_BACKEND_URL = "https://script.google.com/macros/s/AKfycbyof6K9TWBjXsSBevpx6hmk3VZ1971ob7jmng1Bo3piJiRQLujKPx7wLyyhqep8R_wn/exec";

    const DIRECT_CAST_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRruIC2zvcxRfRrtKsgZmHoVOEsiJVEsY7wqRcZzpEkXlMA6_ASTsidzCGrdkp0_7Dt5247cCYCcXSJ/pub?gid=1788082919&single=true&output=csv";

    // Universal Date Formatter for Google Sheets & ISO Strings
    function formatCallBoardDate(rawVal) {
      if (!rawVal) return '';
      if (rawVal instanceof Date && !isNaN(rawVal.getTime())) {
        return rawVal.toLocaleDateString('en-US', {
          weekday: 'short',
          month: 'short',
          day: 'numeric',
          year: 'numeric'
        });
      }
      const str = String(rawVal).trim();
      const ymd = str.match(/^(\d{4})[-/](\d{1,2})[-/](\d{1,2})/);
      if (ymd) {
        const dt = new Date(parseInt(ymd[1], 10), parseInt(ymd[2], 10) - 1, parseInt(ymd[3], 10));
        if (!isNaN(dt.getTime())) {
          return dt.toLocaleDateString('en-US', {
            weekday: 'short',
            month: 'short',
            day: 'numeric',
            year: 'numeric'
          });
        }
      }
      const mdy = str.match(/^(\d{1,2})[-/](\d{1,2})[-/](\d{4})/);
      if (mdy) {
        const dt = new Date(parseInt(mdy[3], 10), parseInt(mdy[1], 10) - 1, parseInt(mdy[2], 10));
        if (!isNaN(dt.getTime())) {
          return dt.toLocaleDateString('en-US', {
            weekday: 'short',
            month: 'short',
            day: 'numeric',
            year: 'numeric'
          });
        }
      }
      const parsed = new Date(str);
      if (!isNaN(parsed.getTime())) {
        return parsed.toLocaleDateString('en-US', {
          weekday: 'short',
          month: 'short',
          day: 'numeric',
          year: 'numeric'
        });
      }
      return str;
    }

    function parseDateTimestamp(val) {
      if (!val) return 0;
      if (val instanceof Date) return val.getTime();
      const str = String(val).trim();
      const ymd = str.match(/^(\d{4})[-/](\d{1,2})[-/](\d{1,2})/);
      if (ymd) {
        return new Date(parseInt(ymd[1], 10), parseInt(ymd[2], 10) - 1, parseInt(ymd[3], 10)).getTime();
      }
      const t = new Date(str).getTime();
      return isNaN(t) ? 0 : t;
    }

    // Synthesized Web Audio Trumpet Fanfare
    function playAudibleFanfare() {
      try {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtx) return;
        const ctx = new AudioCtx();
        if (ctx.state === 'suspended') ctx.resume();

        const notes = [
          { freqs: [466.16], delay: 0.00, dur: 0.12 },
          { freqs: [466.16], delay: 0.14, dur: 0.12 },
          { freqs: [466.16], delay: 0.28, dur: 0.12 },
          { freqs: [587.33, 700], delay: 0.44, dur: 0.35 },
          { freqs: [700], delay: 0.82, dur: 0.18 },
          { freqs: [466.16, 587.33, 932.33], delay: 1.05, dur: 1.3 }
        ];

        const now = ctx.currentTime;
        notes.forEach(note => {
          note.freqs.forEach(freq => {
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(freq, now + note.delay);
            gain.gain.setValueAtTime(0.0001, now + note.delay);
            gain.gain.exponentialRampToValueAtTime(0.18, now + note.delay + 0.03);
            gain.gain.exponentialRampToValueAtTime(0.0001, now + note.delay + note.dur);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start(now + note.delay);
            osc.stop(now + note.delay + note.dur + 0.05);
          });
        });
      } catch (err) {
        console.log("Audio fanfare unsupported or blocked:", err);
      }
    }

    function launchFanfareCelebration() {
      playAudibleFanfare();
      if (typeof confetti === 'function') {
        const colors = ['#38bdf8', '#7dd3fc', '#bae6fd', '#f472b6', '#fbbf24', '#ffffff'];
        confetti({ particleCount: 65, angle: 60, spread: 70, origin: { x: 0.1, y: 0.7 }, colors });
        confetti({ particleCount: 65, angle: 120, spread: 70, origin: { x: 0.9, y: 0.7 }, colors });
        setTimeout(() => {
          confetti({ particleCount: 95, spread: 100, origin: { y: 0.55 }, colors });
        }, 250);
      }
    }

    function renderWithLinks(text) {
      if (!text || typeof text !== 'string') return text;
      const urlRegex = /(https?:\/\/[^\s]+|meet\.google\.com\/[a-zA-Z0-9_-]+)/g;
      const parts = text.split(urlRegex);
      return parts.map((part, i) => {
        if (part && (part.match(/^https?:\/\//) || part.match(/^meet\.google\.com/))) {
          const href = part.startsWith('http') ? part : `https://${part}`;
          return (
            <a
              key={i}
              href={href}
              target="_blank"
              rel="noopener noreferrer"
              className="text-cyan-300 hover:text-cyan-100 underline decoration-cyan-400 font-semibold break-all inline-flex items-center gap-0.5"
              onClick={(e) => e.stopPropagation()}
            >
              <span>{part}</span>
              <span className="text-[10px] no-underline">↗</span>
            </a>
          );
        }
        return part;
      });
    }

    // Cast Processor with Safety Verification
    function processCastRows(rows) {
      if (!Array.isArray(rows) || rows.length < 2) return [];

      const headers = rows[0].map(h => String(h || '').toLowerCase().trim());
      
      // Safety check: ensure this is actually the Cast Sheet, not Rehearsal sheet
      const hasCastHeaders = headers.some(h => 
        h.includes('role') || h.includes('character') || h.includes('part') || 
        h.includes('summer') || h.includes('winter') || h.includes('actor')
      );
      if (!hasCastHeaders) return [];

      const catIdx = headers.findIndex(h => h.includes('cat') || h.includes('type') || h.includes('group') || h.includes('tier'));
      const roleIdx = headers.findIndex(h => h.includes('role') || h.includes('character') || h.includes('part'));
      const col2Idx = headers.findIndex(h => h.includes('summer') || h.includes('snow') || h.includes('cast a') || h.includes('actor') || h.includes('name'));
      const col3Idx = headers.findIndex(h => h.includes('winter') || h.includes('ice') || h.includes('cast b'));

      const effectiveCatCol = catIdx !== -1 ? catIdx : 0;
      const effectiveRoleCol = roleIdx !== -1 ? roleIdx : 1;
      const effectiveCol2 = col2Idx !== -1 ? col2Idx : 2;
      const effectiveCol3 = col3Idx !== -1 ? col3Idx : 3;

      const rawItems = [];
      rows.slice(1).forEach((cols, rowIdx) => {
        const category = String(cols[effectiveCatCol] || 'Company').trim();
        const role = String(cols[effectiveRoleCol] || `Role #${rowIdx + 1}`).trim();
        const valCol2 = String(cols[effectiveCol2] || '').trim();
        const valCol3 = String(cols[effectiveCol3] || '').trim();

        const catLower = category.toLowerCase();
        const roleLower = role.toLowerCase();

        const isFeaturedEnsembleOrChorus = 
          catLower.includes('featured ensemble') || 
          roleLower.includes('featured ensemble') || 
          catLower.includes('chorus') || 
          roleLower.includes('chorus') || 
          catLower.includes('ensemble') || 
          roleLower.includes('ensemble');

        const actors = [valCol2, valCol3].filter(v => v && v.toLowerCase() !== 'tbd');

        if (actors.length === 0) {
          rawItems.push({
            id: 'actor-unassigned-' + rowIdx,
            actorName: 'Pending Assignment',
            role,
            category,
            isFeaturedEnsembleOrChorus
          });
        } else {
          actors.forEach((act, actIdx) => {
            rawItems.push({
              id: `actor-${rowIdx}-${actIdx}`,
              actorName: act,
              role,
              category,
              isFeaturedEnsembleOrChorus
            });
          });
        }
      });

      const actorMap = new Map();
      rawItems.forEach(item => {
        const key = item.actorName.toLowerCase().trim();
        if (!actorMap.has(key)) {
          actorMap.set(key, {
            id: item.id,
            actorName: item.actorName,
            roles: [item.role],
            categories: [item.category],
            isFeaturedEnsembleOrChorus: item.isFeaturedEnsembleOrChorus
          });
        } else {
          const existing = actorMap.get(key);
          if (!existing.roles.includes(item.role)) existing.roles.push(item.role);
          if (!existing.categories.includes(item.category)) existing.categories.push(item.category);
        }
      });

      return Array.from(actorMap.values())
        .map(a => ({
          ...a,
          role: a.roles.join(', '),
          category: a.categories.join(' / ')
        }))
        .sort((a, b) => a.actorName.localeCompare(b.actorName, undefined, { sensitivity: 'base' }));
    }

    const INITIAL_CALL_TYPES = [
      'Saturday Company (Full Cast)',
      'Wednesday Partial Call',
      'Parent Meeting',
      'Principals Vocal Clinic',
      'Choreography Blocking',
      'Music & Harmonies',
      'Tech / Dress Rehearsal'
    ];

    const TAB_INFO = {
      callboard: { label: 'Call Board & Schedule', icon: '📅', path: 'callboard' },
      cast: { label: 'Cast Members', icon: '🎭', path: 'cast' },
      costumes: { label: 'Costumes', icon: '👗', path: 'costumes' },
      music: { label: 'Rehearsal Tracks', icon: '🎵', path: 'music' },
      videos: { label: 'Choreography Vault', icon: '🎬', path: 'videos' },
      calendar: { label: 'Master Schedule', icon: '🗓️', path: 'calendar' }
    };

    function ProductionApp() {
      const getInitialTab = () => {
        const hash = window.location.hash.replace('#', '').toLowerCase();
        return TAB_INFO[hash] ? hash : 'callboard';
      };

      const [activeTab, setActiveTab] = useState(getInitialTab);
      const [copiedBreadcrumb, setCopiedBreadcrumb] = useState(false);

      const [adminSessionToken, setAdminSessionToken] = useState(() => sessionStorage.getItem('frozen_admin_token') || '');
      const isAdmin = Boolean(adminSessionToken);
      const [showLoginModal, setShowLoginModal] = useState(false);
      const [adminPinInput, setAdminPinInput] = useState('');
      const [adminPinError, setAdminPinError] = useState('');
      const [isAuthenticating, setIsAuthenticating] = useState(false);

      // Instant 0ms Cache initialization
      const [actorList, setActorList] = useState(() => {
        const saved = localStorage.getItem('frozen_cast_list');
        return saved ? JSON.parse(saved) : [];
      });
      const [isLoadingCast, setIsLoadingCast] = useState(() => !localStorage.getItem('frozen_cast_list'));
      const [castError, setCastError] = useState(null);
      const [selectedCategoryFilter, setSelectedCategoryFilter] = useState('ALL');
      const [castFilterQuery, setCastFilterQuery] = useState('');

      const [revealedCardIds, setRevealedCardIds] = useState([]);
      const [celebrationTarget, setCelebrationTarget] = useState(null);

      const [callTypes, setCallTypes] = useState(() => {
        const saved = localStorage.getItem('frozen_call_types');
        return saved ? JSON.parse(saved) : INITIAL_CALL_TYPES;
      });

      const [rehearsals, setRehearsals] = useState(() => {
        const saved = localStorage.getItem('frozen_rehearsals');
        return saved ? JSON.parse(saved) : [];
      });
      const [backendStatus, setBackendStatus] = useState('Connecting to backend...');
      const [callSearchRole, setCallSearchRole] = useState('');

      // Fast Local Cached Calendar State (0ms load)
      const [calendarEvents, setCalendarEvents] = useState(() => {
        const saved = localStorage.getItem('frozen_calendar_events');
        return saved ? JSON.parse(saved) : [];
      });
      const [isLoadingCalendar, setIsLoadingCalendar] = useState(() => !localStorage.getItem('frozen_calendar_events'));
      const [calendarSearch, setCalendarSearch] = useState('');
      const [calendarViewMode, setCalendarViewMode] = useState('next8');
      const [selectedCalendarEvent, setSelectedCalendarEvent] = useState(null);

      const [isEditingCall, setIsEditingCall] = useState(false);
      const [editCallData, setEditCallData] = useState({
        id: '',
        title: '',
        date: '',
        time: '',
        location: '',
        type: 'Wednesday Partial Call',
        customType: '',
        calledRoles: [],
        focusScenes: '',
        notes: ''
      });
      const [isCustomTypeMode, setIsCustomTypeMode] = useState(false);

      const navigateToTab = (tabId) => {
        setActiveTab(tabId);
        window.location.hash = tabId;
      };

      useEffect(() => {
        const handleHashChange = () => {
          const hash = window.location.hash.replace('#', '').toLowerCase();
          if (TAB_INFO[hash]) setActiveTab(hash);
        };
        window.addEventListener('hashchange', handleHashChange);
        return () => window.removeEventListener('hashchange', handleHashChange);
      }, []);

      const copyCurrentBreadcrumbLink = () => {
        const url = window.location.origin + window.location.pathname + '#' + activeTab;
        navigator.clipboard.writeText(url).then(() => {
          setCopiedBreadcrumb(true);
          setTimeout(() => setCopiedBreadcrumb(false), 2000);
        });
      };

      // Resilient Cast Fetcher
      const loadLiveCast = async () => {
        if (actorList.length === 0) setIsLoadingCast(true);
        setCastError(null);

        // 1. Try Backend Proxy
        try {
          const res = await fetch(`${CALLBOARD_BACKEND_URL}?action=getCast&t=${Date.now()}`);
          if (res.ok) {
            const data = await res.json();
            if (Array.isArray(data) && data.length > 1) {
              const parsed = processCastRows(data);
              if (parsed.length > 0) {
                setActorList(parsed);
                localStorage.setItem('frozen_cast_list', JSON.stringify(parsed));
                setIsLoadingCast(false);
                return;
              }
            }
          }
        } catch (err) {
          console.warn("Backend proxy failed for cast, falling back to direct CSV...", err);
        }

        // 2. Direct CSV Fallback
        try {
          const fallbackRes = await fetch(`${DIRECT_CAST_CSV_URL}&t=${Date.now()}`);
          if (!fallbackRes.ok) throw new Error("Could not fetch Cast spreadsheet.");
          const csvText = await fallbackRes.text();
          
          const rawLines = csvText.trim().split(/\r?\n/).map(line => {
            const row = [];
            let cur = '';
            let inQuotes = false;
            for (let i = 0; i < line.length; i++) {
              const char = line[i];
              if (char === '"') inQuotes = !inQuotes;
              else if (char === ',' && !inQuotes) {
                row.push(cur.trim().replace(/^"|"$/g, ''));
                cur = '';
              } else cur += char;
            }
            row.push(cur.trim().replace(/^"|"$/g, ''));
            return row;
          });

          const parsed = processCastRows(rawLines);
          if (parsed.length > 0) {
            setActorList(parsed);
            localStorage.setItem('frozen_cast_list', JSON.stringify(parsed));
          } else {
            setCastError("Cast spreadsheet returned no actor rows.");
          }
        } catch (fallbackErr) {
          console.error("Both cast fetch methods failed:", fallbackErr);
          setCastError("Could not load cast roster. Please check network connection.");
        } finally {
          setIsLoadingCast(false);
        }
      };

      const fetchBackendRehearsals = async () => {
        if (!CALLBOARD_BACKEND_URL) return;
        try {
          const res = await fetch(`${CALLBOARD_BACKEND_URL}?t=${Date.now()}`);
          const data = await res.json();
          if (Array.isArray(data)) {
            const formatted = data.map(item => ({
              ...item,
              calledRoles: typeof item.calledRoles === 'string' ? item.calledRoles.split(',').map(s=>s.trim()).filter(Boolean) : (item.calledRoles || []),
              focusScenes: typeof item.focusScenes === 'string' ? item.focusScenes.split(',').map(s=>s.trim()).filter(Boolean) : (item.focusScenes || [])
            }));
            formatted.sort((a, b) => parseDateTimestamp(a.date) - parseDateTimestamp(b.date));
            setRehearsals(formatted);
            localStorage.setItem('frozen_rehearsals', JSON.stringify(formatted));
            setBackendStatus('Connected to Google Sheet Backend');
          }
        } catch (e) {
          console.log('Backend sync offline, using local storage.');
          setBackendStatus('Offline / Local Storage Mode');
        }
      };

      // Fast Calendar Fetcher with Local Storage
      const fetchCalendarEvents = async () => {
        if (!CALLBOARD_BACKEND_URL) return;
        if (calendarEvents.length === 0) setIsLoadingCalendar(true);

        try {
          const res = await fetch(`${CALLBOARD_BACKEND_URL}?action=getCalendarEvents&t=${Date.now()}`);
          const data = await res.json();
          if (Array.isArray(data)) {
            data.sort((a, b) => new Date(a.startTime) - new Date(b.startTime));
            setCalendarEvents(data);
            localStorage.setItem('frozen_calendar_events', JSON.stringify(data));
          }
        } catch (err) {
          console.log("Could not load calendar feed:", err);
        } finally {
          setIsLoadingCalendar(false);
        }
      };

      useEffect(() => {
        loadLiveCast();
        fetchBackendRehearsals();
        fetchCalendarEvents();
      }, []);

      useEffect(() => {
        localStorage.setItem('frozen_rehearsals', JSON.stringify(rehearsals));
      }, [rehearsals]);

      useEffect(() => {
        localStorage.setItem('frozen_call_types', JSON.stringify(callTypes));
      }, [callTypes]);

      const handleLogin = async (e) => {
        e.preventDefault();
        setIsAuthenticating(true);
        setAdminPinError('');

        try {
          const res = await fetch(CALLBOARD_BACKEND_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'text/plain;charset=utf-8' },
            body: JSON.stringify({ action: 'verifyPin', pin: adminPinInput })
          });
          const result = await res.json();

          if (result.status === 'success') {
            sessionStorage.setItem('frozen_admin_token', adminPinInput);
            setAdminSessionToken(adminPinInput);
            setShowLoginModal(false);
            setAdminPinInput('');
          } else {
            setAdminPinError(result.message || 'Invalid PIN. Access denied.');
          }
        } catch (err) {
          setAdminPinError('Error connecting to authentication server.');
        } finally {
          setIsAuthenticating(false);
        }
      };

      const handleLogout = () => {
        sessionStorage.removeItem('frozen_admin_token');
        setAdminSessionToken('');
      };

      const openAddCall = () => {
        setEditCallData({
          id: 'reh-' + Date.now(),
          title: '',
          date: new Date().toISOString().split('T')[0],
          time: '',
          location: '',
          type: callTypes[0] || 'Wednesday Partial Call',
          customType: '',
          calledRoles: [],
          focusScenes: '',
          notes: ''
        });
        setIsCustomTypeMode(false);
        setIsEditingCall(true);
      };

      const openEditCall = (reh) => {
        setEditCallData({
          ...reh,
          customType: '',
          calledRoles: Array.isArray(reh.calledRoles) ? reh.calledRoles : (reh.calledRoles ? [reh.calledRoles] : []),
          focusScenes: Array.isArray(reh.focusScenes) ? reh.focusScenes.join(', ') : (reh.focusScenes || '')
        });
        setIsCustomTypeMode(!callTypes.includes(reh.type));
        setIsEditingCall(true);
      };

      const toggleCalledRole = (roleTag) => {
        const cur = [...editCallData.calledRoles];
        const idx = cur.indexOf(roleTag);
        if (idx > -1) {
          cur.splice(idx, 1);
        } else {
          cur.push(roleTag);
        }
        setEditCallData({ ...editCallData, calledRoles: cur });
      };

      const selectAllGroup = (groupType) => {
        let tags = [];
        if (groupType === 'FULL_COMPANY') {
          tags = ['Full Cast & Company (All Members)'];
        } else if (groupType === 'ALL_PRINCIPALS') {
          tags = actorList.filter(c => !c.isFeaturedEnsembleOrChorus).map(c => `${c.actorName} (${c.role})`);
        } else if (groupType === 'ALL_ENSEMBLE') {
          tags = actorList.filter(c => c.isFeaturedEnsembleOrChorus).map(c => `${c.actorName} (${c.role})`);
        }
        const merged = Array.from(new Set([...editCallData.calledRoles, ...tags]));
        setEditCallData({ ...editCallData, calledRoles: merged });
      };

      const clearAllRoles = () => {
        setEditCallData({ ...editCallData, calledRoles: [] });
      };

      const openCelebration = (item) => {
        if (!revealedCardIds.includes(item.id)) {
          setRevealedCardIds(prev => [...prev, item.id]);
        }
        setCelebrationTarget(item);
        launchFanfareCelebration();
      };

      const revealAllRoles = () => {
        const allIds = actorList.map(a => a.id);
        setRevealedCardIds(allIds);
        launchFanfareCelebration();
      };

      const resetHiddenRoles = () => {
        setRevealedCardIds([]);
      };

      const saveCall = async (e) => {
        e.preventDefault();

        let finalType = editCallData.type;
        if (isCustomTypeMode && editCallData.customType.trim()) {
          finalType = editCallData.customType.trim();
          if (!callTypes.includes(finalType)) {
            setCallTypes(prev => [...prev, finalType]);
          }
        }

        const sceneArray = typeof editCallData.focusScenes === 'string'
          ? editCallData.focusScenes.split(',').map(s => s.trim()).filter(Boolean)
          : editCallData.focusScenes;

        const newEntry = {
          ...editCallData,
          type: finalType,
          calledRoles: editCallData.calledRoles,
          focusScenes: sceneArray
        };

        const existingIndex = rehearsals.findIndex(r => r.id === newEntry.id);
        let updated = [];
        if (existingIndex > -1) {
          updated = [...rehearsals];
          updated[existingIndex] = newEntry;
        } else {
          updated = [...rehearsals, newEntry];
        }

        updated.sort((a, b) => parseDateTimestamp(a.date) - parseDateTimestamp(b.date));
        setRehearsals(updated);
        localStorage.setItem('frozen_rehearsals', JSON.stringify(updated));
        setIsEditingCall(false);

        if (CALLBOARD_BACKEND_URL) {
          try {
            const res = await fetch(CALLBOARD_BACKEND_URL, {
              method: 'POST',
              headers: { 'Content-Type': 'text/plain;charset=utf-8' },
              body: JSON.stringify({ action: 'save', pin: adminSessionToken, item: newEntry })
            });
            const data = await res.json();
            if (data.status === 'error') {
              alert('Save failed: ' + data.message);
            }
          } catch (err) {
            console.error('Error posting to backend', err);
          }
        }
      };

      const deleteCall = async (id) => {
        if (confirm("Delete this rehearsal call notice?")) {
          const updated = rehearsals.filter(r => r.id !== id);
          setRehearsals(updated);
          localStorage.setItem('frozen_rehearsals', JSON.stringify(updated));

          if (CALLBOARD_BACKEND_URL) {
            try {
              const res = await fetch(CALLBOARD_BACKEND_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                body: JSON.stringify({ action: 'delete', pin: adminSessionToken, id })
              });
              const data = await res.json();
              if (data.status === 'error') {
                alert('Delete failed: ' + data.message);
              }
            } catch (err) {
              console.error('Error sending delete to backend', err);
            }
          }
        }
      };

      const filteredRehearsals = useMemo(() => {
        if (!callSearchRole.trim()) return rehearsals;
        const query = callSearchRole.toLowerCase();
        return rehearsals.filter(r => {
          const inRoles = Array.isArray(r.calledRoles) && r.calledRoles.some(role => role.toLowerCase().includes(query) || role.toLowerCase() === 'full cast' || role.toLowerCase() === 'company');
          const inTitle = r.title && r.title.toLowerCase().includes(query);
          return inRoles || inTitle;
        });
      }, [rehearsals, callSearchRole]);

      const availableCategories = useMemo(() => {
        const cats = Array.from(new Set(actorList.map(c => c.category || 'Company')));
        return ['ALL', ...cats];
      }, [actorList]);

      const filteredActorCards = useMemo(() => {
        const q = castFilterQuery.toLowerCase();
        return actorList.filter(item => {
          const matchesQuery = item.actorName.toLowerCase().includes(q) || 
                               item.role.toLowerCase().includes(q) || 
                               item.category.toLowerCase().includes(q);
          const matchesCategory = selectedCategoryFilter === 'ALL' || item.category === selectedCategoryFilter;
          return matchesQuery && matchesCategory;
        });
      }, [actorList, castFilterQuery, selectedCategoryFilter]);

      const allRevealed = actorList.length > 0 && revealedCardIds.length >= actorList.length;

      const visibleCalendarEvents = useMemo(() => {
        const q = calendarSearch.toLowerCase().trim();
        const filtered = calendarEvents.filter(ev => {
          if (!q) return true;
          return (ev.title && ev.title.toLowerCase().includes(q)) || 
                 (ev.location && ev.location.toLowerCase().includes(q)) ||
                 (ev.description && ev.description.toLowerCase().includes(q));
        });

        if (calendarViewMode === 'next8' && !q) {
          return filtered.slice(0, 8);
        }
        return filtered;
      }, [calendarEvents, calendarSearch, calendarViewMode]);

      const groupedCalendarEvents = useMemo(() => {
        const groups = {};
        visibleCalendarEvents.forEach(ev => {
          const d = new Date(ev.startTime);
          const monthYear = d.toLocaleDateString('en-US', { month: 'long', year: 'numeric' });
          if (!groups[monthYear]) groups[monthYear] = [];
          groups[monthYear].push(ev);
        });
        return groups;
      }, [visibleCalendarEvents]);

      return (
        <div className="max-w-6xl mx-auto px-4 py-6">
          {/* Header Banner */}
          <header className="flex flex-col md:flex-row items-center justify-between gap-5 border-b border-cyan-500/20 pb-6 mb-5">
            <div className="flex flex-col sm:flex-row items-center gap-5 text-center sm:text-left">
              <div className="relative group shrink-0">
                <div className="absolute -inset-1 rounded-2xl bg-gradient-to-r from-sky-400 to-cyan-600 opacity-40 blur-md group-hover:opacity-75 transition duration-500"></div>
                <img 
                  src={FROZEN_HERO_IMAGE_URL} 
                  alt="Disney's Frozen JR. Official Artwork"
                  className="relative h-20 md:h-24 w-auto max-w-[280px] sm:max-w-[340px] rounded-xl object-contain shadow-2xl border border-cyan-400/40 bg-slate-950/80 p-1"
                />
              </div>

              <div className="border-t sm:border-t-0 sm:border-l border-cyan-700/50 pt-3 sm:pt-0 sm:pl-5">
                <span className="text-[11px] uppercase tracking-widest text-cyan-300 font-extrabold bg-cyan-950/90 px-3 py-1 rounded-full border border-cyan-700/70 inline-block mb-1.5 shadow-sm">
                  Production Portal & Call Board
                </span>
                <p className="text-xs md:text-sm text-cyan-100/80 font-medium">
                  Rehearsals • Live Cast & Characters • Music Vault • Schedule
                </p>
              </div>
            </div>

            <div className="flex items-center gap-3 shrink-0">
              {isAdmin ? (
                <div className="flex items-center gap-3 bg-emerald-950/80 border border-emerald-500/50 text-emerald-200 px-4 py-2 rounded-xl text-xs md:text-sm font-semibold shadow-lg">
                  <span className="inline-block w-2.5 h-2.5 rounded-full bg-emerald-400 animate-pulse"></span>
                  Director / Crew Admin
                  <button 
                    onClick={handleLogout}
                    className="ml-2 text-emerald-400 hover:text-white underline text-xs">
                    Lock
                  </button>
                </div>
              ) : (
                <button 
                  onClick={() => setShowLoginModal(true)}
                  className="flex items-center gap-2 bg-slate-800/90 hover:bg-slate-700 border border-cyan-500/30 text-cyan-200 px-4 py-2 rounded-xl text-xs md:text-sm font-semibold transition shadow-md">
                  <svg className="w-4 h-4 text-cyan-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/></svg>
                  Staff Login
                </button>
              )}
            </div>
          </header>

          {/* URL Breadcrumb Navigator Bar */}
          <div className="flex items-center justify-between py-2 px-3 mb-4 rounded-xl bg-slate-950/60 border border-cyan-950 text-xs">
            <div className="flex items-center gap-1.5 text-slate-400">
              <span className="text-cyan-400">❄️ Frozen JR</span>
              <span>/</span>
              <span className="text-slate-300 font-semibold">{TAB_INFO[activeTab]?.icon} {TAB_INFO[activeTab]?.label}</span>
              <span className="hidden sm:inline font-mono text-[11px] text-cyan-500/70">#{activeTab}</span>
            </div>

            <button
              onClick={copyCurrentBreadcrumbLink}
              className="flex items-center gap-1 text-[11px] font-semibold text-cyan-300 hover:text-white bg-slate-900 hover:bg-slate-800 px-2.5 py-1 rounded-lg border border-cyan-900 transition"
              title="Copy direct link to this page"
            >
              <span>{copiedBreadcrumb ? '✓ Copied Link!' : '🔗 Copy Direct Link'}</span>
            </button>
          </div>

          {/* Navigation Bar */}
          <nav className="flex flex-wrap items-center gap-2 mb-8 bg-slate-900/60 p-1.5 rounded-2xl border border-cyan-900/50 backdrop-blur-md">
            {Object.keys(TAB_INFO).map(key => {
              const tab = TAB_INFO[key];
              return (
                <button
                  key={key}
                  onClick={() => navigateToTab(key)}
                  className={`flex items-center gap-2 px-4 py-2.5 rounded-xl font-bold text-xs md:text-sm transition-all duration-200 flex-1 md:flex-initial text-center justify-center ${
                    activeTab === key
                      ? 'bg-gradient-to-r from-cyan-600 to-sky-600 text-white shadow-md shadow-cyan-900/50'
                      : 'text-slate-300 hover:text-white hover:bg-slate-800/60'
                  }`}
                >
                  <span>{tab.icon}</span>
                  <span>{tab.label}</span>
                </button>
              );
            })}
          </nav>

          {/* ======================================================== */}
          {/* TAB 1: CALL BOARD & REHEARSAL CALLS                      */}
          {/* ======================================================== */}
          {activeTab === 'callboard' && (
            <div className="space-y-6">
              <div className="glass-card p-5 rounded-2xl flex flex-col md:flex-row items-center justify-between gap-4">
                <div className="w-full md:w-auto flex-1">
                  <div className="relative">
                    <input 
                      type="text"
                      placeholder="Filter by actor or character role..."
                      value={callSearchRole}
                      onChange={(e) => setCallSearchRole(e.target.value)}
                      className="w-full bg-slate-950/70 border border-cyan-800/70 rounded-xl px-4 py-2.5 text-sm text-cyan-100 placeholder-slate-400 focus:outline-none focus:border-cyan-400"
                    />
                    {callSearchRole && (
                      <button 
                        onClick={() => setCallSearchRole('')}
                        className="absolute right-3 top-2.5 text-xs text-slate-400 hover:text-white">
                        Clear
                      </button>
                    )}
                  </div>
                  <div className="flex items-center gap-3 text-xs text-slate-400 mt-2">
                    <span>💡 Wednesday calls target specific scenes based on Saturday notes.</span>
                    <span className="text-emerald-400 font-semibold flex items-center gap-1">
                      ● {backendStatus}
                    </span>
                  </div>
                </div>

                {isAdmin && (
                  <div className="flex flex-wrap items-center gap-3 w-full md:w-auto">
                    <button
                      onClick={openAddCall}
                      className="w-full md:w-auto bg-gradient-to-r from-emerald-600 to-teal-500 hover:from-emerald-500 hover:to-teal-400 text-white font-bold px-4 py-2.5 rounded-xl text-xs md:text-sm shadow-lg flex items-center justify-center gap-2 transition"
                    >
                      <span className="text-base font-black">+</span> Post New Rehearsal Call
                    </button>
                  </div>
                )}
              </div>

              {/* Call Cards List */}
              <div className="grid gap-5">
                {filteredRehearsals.map((reh) => {
                  const isFullCast = (reh.type && reh.type.toLowerCase().includes('full cast')) || 
                                     (Array.isArray(reh.calledRoles) && reh.calledRoles.some(r => r.toLowerCase().includes('full cast') || r.toLowerCase() === 'company'));
                  const formattedDate = formatCallBoardDate(reh.date);

                  return (
                    <div 
                      key={reh.id} 
                      className={`glass-card p-6 rounded-2xl relative transition hover:border-cyan-400/50 ${
                        isFullCast ? 'border-l-4 border-l-cyan-400' : 'border-l-4 border-l-amber-400'
                      }`}
                    >
                      <div className="flex flex-col md:flex-row md:items-center justify-between gap-3 border-b border-slate-700/50 pb-4 mb-4">
                        <div>
                          <div className="flex flex-wrap items-center gap-2 mb-1">
                            <span className={`text-[11px] font-extrabold uppercase px-2.5 py-0.5 rounded-md ${
                              isFullCast 
                                ? 'bg-cyan-950 text-cyan-300 border border-cyan-800' 
                                : 'bg-amber-950/80 text-amber-300 border border-amber-800/80'
                            }`}>
                              {reh.type}
                            </span>
                            {reh.location && (
                              <span className="text-xs font-semibold text-slate-300 flex items-center gap-1">
                                📍 {renderWithLinks(reh.location)}
                              </span>
                            )}
                          </div>
                          <h3 className="text-xl font-bold text-white font-cinzel">
                            {renderWithLinks(reh.title || 'Rehearsal Call')}
                          </h3>
                        </div>

                        {(formattedDate || reh.time) && (
                          <div className="bg-slate-900/90 border border-cyan-900 px-4 py-2 rounded-xl text-left md:text-right shrink-0">
                            {formattedDate && (
                              <div className="text-sm font-black text-cyan-300">
                                {formattedDate}
                              </div>
                            )}
                            {reh.time && <div className="text-xs text-slate-300 font-semibold">{reh.time}</div>}
                          </div>
                        )}
                      </div>

                      <div className="grid md:grid-cols-2 gap-4 text-sm">
                        <div className="bg-slate-950/50 p-3.5 rounded-xl border border-slate-800">
                          <div className="text-xs uppercase tracking-wider text-cyan-400 font-bold mb-2 flex items-center justify-between">
                            <span className="flex items-center gap-1.5">👥 Called Performers:</span>
                            <span className="text-[10px] text-slate-400 font-normal">
                              {Array.isArray(reh.calledRoles) ? `${reh.calledRoles.length} called` : ''}
                            </span>
                          </div>
                          <div className="flex flex-wrap gap-1.5 max-h-48 overflow-y-auto pr-1">
                            {Array.isArray(reh.calledRoles) && reh.calledRoles.length > 0 ? (
                              reh.calledRoles.map((roleTag, i) => (
                                <span 
                                  key={i} 
                                  className="px-2.5 py-1 rounded-lg text-xs font-bold border bg-cyan-500/20 text-cyan-200 border-cyan-500/40"
                                >
                                  {roleTag}
                                </span>
                              ))
                            ) : (
                              <span className="text-slate-400 italic text-xs">No specific performers selected.</span>
                            )}
                          </div>
                        </div>

                        <div className="bg-slate-950/50 p-3.5 rounded-xl border border-slate-800">
                          <div className="text-xs uppercase tracking-wider text-amber-400 font-bold mb-2 flex items-center gap-1.5">
                            <span>🎭</span> Working Scenes & Music:
                          </div>
                          {Array.isArray(reh.focusScenes) && reh.focusScenes.length > 0 ? (
                            <ul className="list-disc list-inside text-xs text-slate-300 space-y-1">
                              {reh.focusScenes.map((sc, i) => (
                                <li key={i}><span className="font-semibold text-slate-200">{renderWithLinks(sc)}</span></li>
                              ))}
                            </ul>
                          ) : (
                            <span className="text-slate-400 italic text-xs">General rehearsal / blocking.</span>
                          )}
                        </div>
                      </div>

                      {reh.notes && (
                        <div className="mt-3 text-xs text-cyan-200/90 bg-cyan-950/30 border border-cyan-800/40 p-2.5 rounded-lg flex items-start gap-2">
                          <span className="text-cyan-400 font-bold">📝 Note:</span>
                          <span className="leading-relaxed">{renderWithLinks(reh.notes)}</span>
                        </div>
                      )}

                      {isAdmin && (
                        <div className="mt-4 pt-3 border-t border-slate-800/80 flex items-center justify-end gap-3 text-xs">
                          <button
                            onClick={() => openEditCall(reh)}
                            className="text-cyan-400 hover:text-cyan-300 font-semibold flex items-center gap-1">
                            ✏️ Edit Call
                          </button>
                          <button
                            onClick={() => deleteCall(reh.id)}
                            className="text-red-400 hover:text-red-300 font-semibold flex items-center gap-1">
                            🗑️ Delete
                          </button>
                        </div>
                      )}
                    </div>
                  );
                })}

                {filteredRehearsals.length === 0 && (
                  <div className="glass-card p-12 text-center rounded-2xl">
                    <div className="text-4xl mb-3">📋</div>
                    <h4 className="text-lg font-bold font-cinzel text-white">No Active Rehearsal Calls</h4>
                    <p className="text-xs text-slate-400 max-w-md mx-auto mt-1">
                      Check back after Saturday rehearsals when targeted Wednesday calls are published by the director and stage management.
                    </p>
                    {isAdmin && (
                      <button
                        onClick={openAddCall}
                        className="mt-4 bg-cyan-600 hover:bg-cyan-500 text-white font-bold px-4 py-2 rounded-xl text-xs transition"
                      >
                        + Post First Notice
                      </button>
                    )}
                  </div>
                )}
              </div>
            </div>
          )}

          {/* ======================================================== */}
          {/* TAB 2: LIVE ACTOR CARDS (MYSTERY UNTIL CLICKED)          */}
          {/* ======================================================== */}
          {activeTab === 'cast' && (
            <div className="space-y-6">
              <div className="glass-card rounded-2xl overflow-hidden shadow-2xl border border-purple-500/40 bg-gradient-to-r from-purple-950/70 via-slate-900/80 to-cyan-950/60 p-5">
                <div className="flex items-start gap-4">
                  <div className="w-12 h-12 rounded-2xl bg-purple-900/80 border border-purple-400/40 flex items-center justify-center text-2xl shrink-0 shadow-lg">
                    ✨
                  </div>
                  <div>
                    <span className="text-[10px] font-extrabold uppercase tracking-widest bg-purple-950 text-purple-300 px-2.5 py-0.5 rounded border border-purple-700/60">
                      Casting & Role Assignment Notice
                    </span>
                    <h3 className="font-cinzel font-bold text-white text-base md:text-lg mt-1">
                      Cast & Ensemble Assignments
                    </h3>
                    <p className="text-xs md:text-sm text-purple-100/90 mt-1.5 leading-relaxed font-medium">
                      There will be two full casts of Frozen Jr. Which cast each actor will belong to will depend on availability. Featured ensemble roles have lines. Which featured ensemble member each actor will play will be assigned in rehearsals.
                    </p>
                  </div>
                </div>
              </div>

              {/* Sync Status Banner */}
              <div className="glass-card p-4 rounded-2xl flex flex-col sm:flex-row items-center justify-between gap-3 border-l-4 border-l-cyan-400">
                <div className="flex items-center gap-3">
                  <div className="text-2xl shrink-0">🎁</div>
                  <div>
                    <h4 className="text-sm font-bold text-white flex items-center gap-2">
                      Mystery Reveal Cards
                      <span className="inline-block w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
                    </h4>
                    <p className="text-xs text-slate-300">
                      Roles and categories are completely hidden until tapped! Or click <strong>Reveal All Roles</strong> to expose everyone.
                    </p>
                  </div>
                </div>

                <div className="flex flex-wrap items-center gap-2">
                  {allRevealed ? (
                    <button
                      onClick={resetHiddenRoles}
                      className="bg-amber-950/90 hover:bg-amber-900 text-amber-300 text-xs font-bold px-3.5 py-2 rounded-xl border border-amber-600/80 flex items-center gap-1.5 transition shadow-lg shadow-amber-950/40"
                    >
                      <span>🔒</span>
                      <span>Re-hide All Roles</span>
                    </button>
                  ) : (
                    <button
                      onClick={revealAllRoles}
                      className="bg-gradient-to-r from-emerald-600 to-teal-500 hover:from-emerald-500 hover:to-teal-400 text-white text-xs font-extrabold px-3.5 py-2 rounded-xl transition shadow-lg shadow-emerald-950/40 flex items-center gap-1.5"
                    >
                      <span>🔓</span>
                      <span>Reveal All Roles</span>
                    </button>
                  )}

                  {revealedCardIds.length > 0 && !allRevealed && (
                    <button
                      onClick={resetHiddenRoles}
                      className="bg-slate-900 hover:bg-slate-800 text-slate-300 text-xs font-bold px-3 py-2 rounded-xl border border-slate-700 flex items-center gap-1.5 transition"
                      title="Re-hide revealed roles"
                    >
                      <span>🔒 Reset</span>
                    </button>
                  )}

                  <button
                    onClick={loadLiveCast}
                    disabled={isLoadingCast}
                    className="bg-slate-800 hover:bg-slate-700 text-cyan-300 text-xs font-bold px-3 py-1.5 rounded-xl border border-cyan-800 flex items-center gap-1.5 transition disabled:opacity-50"
                  >
                    <span className={isLoadingCast ? 'animate-spin' : ''}>↻</span>
                    <span>{isLoadingCast ? 'Fetching...' : 'Refresh Cast'}</span>
                  </button>
                </div>
              </div>

              {/* Filter Toolbar */}
              <div className="glass-card p-4 rounded-2xl flex flex-col md:flex-row items-center justify-between gap-4">
                <div className="w-full md:w-80">
                  <input
                    type="text"
                    placeholder="Search performer or character..."
                    value={castFilterQuery}
                    onChange={(e) => setCastFilterQuery(e.target.value)}
                    className="w-full bg-slate-950/70 border border-cyan-800/70 rounded-xl px-3.5 py-2 text-xs text-cyan-100 placeholder-slate-400 focus:outline-none focus:border-cyan-400"
                  />
                </div>

                <div className="flex flex-wrap items-center gap-1.5 overflow-x-auto w-full md:w-auto">
                  {availableCategories.map(cat => (
                    <button
                      key={cat}
                      onClick={() => setSelectedCategoryFilter(cat)}
                      className={`px-3 py-1.5 text-xs font-bold rounded-xl transition ${
                        selectedCategoryFilter === cat 
                          ? 'bg-cyan-600 text-white shadow-md' 
                          : 'bg-slate-950/80 text-slate-300 hover:text-white border border-slate-800'
                      }`}
                    >
                      {cat === 'ALL' ? 'All Cast (A-Z)' : cat}
                    </button>
                  ))}
                </div>
              </div>

              {/* Actor Cards */}
              {isLoadingCast && actorList.length === 0 ? (
                <div className="glass-card p-12 text-center text-cyan-300 rounded-3xl">
                  <div className="text-4xl animate-bounce mb-3">❄️</div>
                  <p className="font-cinzel text-lg">Fetching Latest Cast From Google Sheets...</p>

                        badgeClass = 'bg-purple-950/80 text-purple-300 border-purple-800/80';

                  </div>
                </div>
              </div>
            );
          })()}

          {/* ======================================================== */}
          {/* CELEBRATION MODAL                                        */}
          {/* ======================================================== */}
          {celebrationTarget && (
            <div 
              className="fixed inset-0 z-50 bg-slate-950/90 backdrop-blur-md flex items-center justify-center p-4 overflow-y-auto"
              onClick={() => setCelebrationTarget(null)}
            >
              <div 
                className="max-w-md w-full celebration-border p-1 rounded-3xl shadow-2xl relative animate-in fade-in zoom-in duration-300"
                onClick={(e) => e.stopPropagation()}
              >
                <div className="bg-slate-950/95 rounded-[22px] p-6 md:p-8 text-center flex flex-col items-center relative overflow-hidden">
                  <button 
                    onClick={() => setCelebrationTarget(null)}
                    className="absolute top-4 right-4 text-slate-400 hover:text-white bg-slate-900/80 hover:bg-slate-800 w-8 h-8 rounded-full flex items-center justify-center text-sm transition"
                  >
                    ✕
                  </button>

                  <div className="mb-4">
                    <img 
                      src={FROZEN_HERO_IMAGE_URL} 
                      alt="Disney's Frozen JR. Official Artwork"
                      className="h-16 md:h-20 w-auto rounded-xl object-contain shadow-xl border border-cyan-400/40 bg-slate-950/90 p-1"
                    />
                  </div>

                  <span className="text-[11px] uppercase tracking-widest text-cyan-400 font-extrabold bg-cyan-950/90 border border-cyan-700/60 px-3 py-1 rounded-full mb-2">
                    OFFICIAL PRODUCTION CASTING
                  </span>

                  <h4 className="text-xs text-slate-400 uppercase tracking-wider font-semibold mt-1">
                    Congratulations to
                  </h4>

                  <h2 className="text-3xl md:text-4xl font-extrabold font-cinzel text-transparent bg-clip-text bg-gradient-to-r from-sky-200 via-white to-cyan-200 tracking-wide mt-1 mb-4 leading-tight">
                    {celebrationTarget.actorName}
                  </h2>

                  <div className="w-full bg-gradient-to-r from-cyan-950/80 via-slate-900 to-cyan-950/80 border border-cyan-500/40 p-4 rounded-2xl mb-4 shadow-inner">
                    <span className="text-[11px] text-slate-400 uppercase font-bold tracking-widest block mb-1">
                      Cast in the Role of
                    </span>
                    <span className="text-xl md:text-2xl font-cinzel font-black text-cyan-300 block">
                      {celebrationTarget.role}
                    </span>
                    <div className="mt-2 inline-block text-[10px] uppercase font-bold text-slate-400 bg-slate-950/80 px-2.5 py-0.5 rounded border border-slate-800">
                      {celebrationTarget.category || 'Company'}
                    </div>
                  </div>

                  <p className="text-xs text-cyan-200/80 italic mb-6 leading-relaxed">
                    "Some people are worth melting for." ❄️ Have a magical time in rehearsals!
                  </p>

                  <div className="flex flex-col sm:flex-row items-center gap-2.5 w-full">
                    <button
                      type="button"
                      onClick={launchFanfareCelebration}
                      className="w-full bg-gradient-to-r from-cyan-500 via-sky-400 to-indigo-500 hover:from-cyan-400 hover:to-indigo-400 text-slate-950 font-black py-2.5 rounded-xl text-xs md:text-sm shadow-lg shadow-cyan-500/30 transition transform active:scale-95 flex items-center justify-center gap-1.5"
                    >
                      <span>🎺</span>
                      <span>Play Fanfare Again!</span>
                    </button>

                    <button
                      type="button"
                      onClick={() => setCelebrationTarget(null)}
                      className="w-full bg-slate-900 hover:bg-slate-800 text-slate-300 hover:text-white font-bold py-2.5 rounded-xl text-xs border border-slate-800 transition"
                    >
                      Close Card
                    </button>
                  </div>

                  <div className="mt-4 text-[10px] text-slate-500">
                    📸 Perfect photo opportunity! Take a screenshot to share with family & friends.
                  </div>
                </div>
              </div>
            </div>
          )}

          {/* ======================================================== */}
          {/* MODAL: ADMIN LOGIN                                       */}
          {/* ======================================================== */}
          {showLoginModal && (
            <div className="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="glass-card max-w-sm w-full p-6 rounded-3xl border border-cyan-500/40 shadow-2xl relative">
                <button 
                  onClick={() => setShowLoginModal(false)}
                  className="absolute top-4 right-4 text-slate-400 hover:text-white text-lg">
                  ✕
                </button>
                <div className="text-center mb-5">
                  <div className="w-12 h-12 bg-cyan-950 border border-cyan-500 rounded-2xl flex items-center justify-center text-2xl mx-auto mb-2 text-cyan-300">
                    🔒
                  </div>
                  <h3 className="text-lg font-bold font-cinzel text-white">Production Staff Access</h3>
                  <p className="text-xs text-slate-400">Enter crew PIN to post & edit rehearsal calls</p>
                </div>

                <form onSubmit={handleLogin} className="space-y-4">
                  <div>
                    <input 
                      type="password"
                      placeholder="Enter Access PIN"
                      value={adminPinInput}
                      onChange={(e) => setAdminPinInput(e.target.value)}
                      autoFocus
                      disabled={isAuthenticating}
                      className="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-center text-lg font-mono tracking-widest text-cyan-300 focus:outline-none focus:border-cyan-400 disabled:opacity-50"
                    />
                    {adminPinError && (
                      <p className="text-red-400 text-xs mt-1.5 text-center">{adminPinError}</p>
                    )}
                  </div>
                  <button 
                    type="submit"
                    disabled={isAuthenticating}
                    className="w-full bg-gradient-to-r from-cyan-600 to-sky-500 hover:from-cyan-500 hover:to-sky-400 text-slate-950 font-black py-2.5 rounded-xl text-sm transition shadow-lg shadow-cyan-600/30 disabled:opacity-50">
                    {isAuthenticating ? 'Authenticating...' : 'Unlock Admin Tools'}
                  </button>
                </form>
              </div>
            </div>
          )}

          {/* ======================================================== */}
          {/* MODAL: POST / EDIT REHEARSAL CALL                        */}
          {/* ======================================================== */}
          {isEditingCall && (
            <div className="fixed inset-0 z-50 bg-slate-950/85 backdrop-blur-sm flex items-center justify-center p-4 overflow-y-auto">
              <div className="glass-card max-w-2xl w-full p-6 rounded-3xl border border-cyan-500/50 shadow-2xl my-8">
                <div className="flex items-center justify-between pb-3 border-b border-slate-700/60 mb-4">
                  <h3 className="text-lg font-bold font-cinzel text-white">
                    {editCallData.id ? 'Publish / Edit Rehearsal Call' : 'New Rehearsal Call'}
                  </h3>
                  <button onClick={() => setIsEditingCall(false)} className="text-slate-400 hover:text-white">✕</button>
                </div>

                <form onSubmit={saveCall} className="space-y-4 text-xs">
                  <div>
                    <label className="block text-slate-300 font-bold mb-1">Notice Headline</label>
                    <input 
                      type="text"
                      required
                      value={editCallData.title}
                      onChange={(e) => setEditCallData({...editCallData, title: e.target.value})}
                      placeholder="e.g., Wednesday Vocal & Staging Clinic"
                      className="w-full bg-slate-900 border border-slate-700 rounded-xl p-2.5 text-white"
                    />
                  </div>

                  <div className="grid grid-cols-1 md:grid-cols-2 gap-3">
                    <div>
                      <label className="block text-slate-300 font-bold mb-1">Rehearsal Date</label>
                      <input 
                        type="date"
                        required
                        value={editCallData.date}
                        onChange={(e) => setEditCallData({...editCallData, date: e.target.value})}
                        className="w-full bg-slate-900 border border-slate-700 rounded-xl p-2.5 text-white"
                      />
                    </div>

                    <div>
                      <div className="flex items-center justify-between mb-1">
                        <label className="text-slate-300 font-bold">Call Type</label>
                        <button
                          type="button"
                          onClick={() => setIsCustomTypeMode(!isCustomTypeMode)}
                          className="text-[11px] text-cyan-400 hover:underline"
                        >
                          {isCustomTypeMode ? "← Choose from list" : "+ Custom Call Type"}
                        </button>
                      </div>

                      {isCustomTypeMode ? (
                        <input
                          type="text"
                          required
                          value={editCallData.customType}
                          onChange={(e) => setEditCallData({...editCallData, customType: e.target.value})}
                          placeholder="Type custom call category (e.g. Tap Intensive)"
                          className="w-full bg-slate-900 border border-cyan-500 rounded-xl p-2.5 text-cyan-200 font-semibold"
                        />
                      ) : (
                        <select 
                          value={editCallData.type}
                          onChange={(e) => setEditCallData({...editCallData, type: e.target.value})}
                          className="w-full bg-slate-900 border border-slate-700 rounded-xl p-2.5 text-white font-medium"
                        >
                          {callTypes.map((type, idx) => (
                            <option key={idx} value={type}>{type}</option>
                          ))}
                        </select>
                      )}
                    </div>
                  </div>

                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className="block text-slate-300 font-bold mb-1">Time Block</label>
                      <input 
                        type="text"
                        value={editCallData.time}
                        onChange={(e) => setEditCallData({...editCallData, time: e.target.value})}
                        placeholder="e.g., 5:30 PM - 8:00 PM"
                        className="w-full bg-slate-900 border border-slate-700 rounded-xl p-2.5 text-white"
                      />
                    </div>
                    <div>
                      <label className="block text-slate-300 font-bold mb-1">Room / Location (URLs work here)</label>
                      <input 
                        type="text"
                        value={editCallData.location}
                        onChange={(e) => setEditCallData({...editCallData, location: e.target.value})}
                        placeholder="e.g., Main Stage or https://meet.google.com/..."
                        className="w-full bg-slate-900 border border-slate-700 rounded-xl p-2.5 text-white"
                      />
                    </div>
                  </div>

                  <div className="bg-slate-950/70 p-3.5 rounded-2xl border border-slate-800 space-y-3">
                    <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-2 border-b border-slate-800 pb-2">
                      <div>
                        <label className="block text-cyan-300 font-bold text-sm">Select Performers Called</label>
                        <p className="text-[11px] text-slate-400">Select performers individually or by group</p>
                      </div>

                      <div className="flex flex-wrap items-center gap-1.5">
                        <button
                          type="button"
                          onClick={() => selectAllGroup('FULL_COMPANY')}
                          className="bg-cyan-950 hover:bg-cyan-900 text-cyan-300 text-[10px] font-bold px-2 py-1 rounded border border-cyan-800"
                        >
                          + Full Company
                        </button>
                        <button
                          type="button"
                          onClick={() => selectAllGroup('ALL_PRINCIPALS')}
                          className="bg-sky-950 hover:bg-sky-900 text-sky-300 text-[10px] font-bold px-2 py-1 rounded border border-sky-800"
                        >
                          + Principals
                        </button>
                        <button
                          type="button"
                          onClick={() => selectAllGroup('ALL_ENSEMBLE')}
                          className="bg-purple-950 hover:bg-purple-900 text-purple-300 text-[10px] font-bold px-2 py-1 rounded border border-purple-800"
                        >
                          + All Ensemble
                        </button>
                        <button
                          type="button"
                          onClick={clearAllRoles}
                          className="text-red-400 hover:text-white text-[10px] font-bold px-1.5 py-1"
                        >
                          Clear
                        </button>
                      </div>
                    </div>

                    <div className="max-h-56 overflow-y-auto space-y-2 pr-1">
                      {actorList.map((item) => {
                        const performerTag = `${item.actorName} (${item.role})`;
                        const isSelected = editCallData.calledRoles.includes(performerTag);

                        return (
                          <div key={item.id} className="flex items-center justify-between gap-2 p-2 rounded-xl bg-slate-900/80 border border-slate-800/80 hover:border-slate-700">
                            <div>
                              <span className="font-bold text-white text-xs">{item.actorName}</span>
                              <span className="text-[10px] text-slate-400 ml-2">({item.role})</span>
                            </div>

                            <button
                              type="button"
                              onClick={() => toggleCalledRole(performerTag)}
                              className={`px-3 py-1 rounded-lg text-xs font-bold transition ${
                                isSelected
                                  ? 'bg-cyan-500 text-slate-950 font-black shadow-md'
                                  : 'bg-slate-800 text-cyan-300 hover:bg-slate-700'
                              }`}
                            >
                              {isSelected ? '✓ Called' : '+ Add'}
                            </button>
                          </div>
                        );
                      })}
                    </div>

                    <div className="pt-2 border-t border-slate-800 text-xs">
                      <span className="text-slate-400">Currently Called ({editCallData.calledRoles.length}): </span>
                      <span className="text-cyan-200 font-semibold">
                        {editCallData.calledRoles.length > 0 ? editCallData.calledRoles.join(', ') : 'None'}
                      </span>
                    </div>
                  </div>

                  <div>
                    <label className="block text-slate-300 font-bold mb-1">
                      Focus Scenes / Music <span className="font-normal text-slate-400">(Comma-separated)</span>
                    </label>
                    <input 
                      type="text"
                      value={editCallData.focusScenes}
                      onChange={(e) => setEditCallData({...editCallData, focusScenes: e.target.value})}
                      placeholder='e.g., Scene 4: "In Summer", Act 1 Harmonies'
                      className="w-full bg-slate-900 border border-slate-700 rounded-xl p-2.5 text-white"
                    />
                  </div>

                  <div>
                    <label className="block text-slate-300 font-bold mb-1">Production Notes for Parents/Cast (URLs work here)</label>
                    <textarea 
                      rows="2"
                      value={editCallData.notes}
                      onChange={(e) => setEditCallData({...editCallData, notes: e.target.value})}
                      placeholder="Bring character shoes, water, pencils for blocking notes..."
                      className="w-full bg-slate-900 border border-slate-700 rounded-xl p-2.5 text-white"
                    ></textarea>
                  </div>

                  <div className="flex justify-end gap-3 pt-3 border-t border-slate-800">
                    <button 
                      type="button" 
                      onClick={() => setIsEditingCall(false)}
                      className="px-4 py-2 rounded-xl text-slate-300 hover:bg-slate-800">
                      Cancel
                    </button>
                    <button 
                      type="submit"
                      className="bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-black px-5 py-2 rounded-xl transition shadow-lg shadow-cyan-500/20">
                      Publish to Call Board
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

          <footer className="mt-12 text-center text-xs text-slate-500 border-t border-slate-800/80 pt-6">
            <p>Disney's Frozen JR. • Community Youth Theater Production Portal</p>
            <p className="mt-1">Authorized Performance Materials Supplied by Music Theatre International (MTI)</p>
          </footer>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<ProductionApp />);
  </script>
</body>
</html>

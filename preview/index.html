  <style>
/* Tailwind layers + the custom site styles that used to live in index.html <style>. */




body {
  font-family: 'Nunito', sans-serif;
  background: radial-gradient(circle at 50% 0%, #0c4a6e 0%, #031828 100%);
  color: #f1f5f9;
  min-height: 100vh;
  top: 0px !important;
  overflow-x: hidden;
}
.font-cinzel { font-family: 'Cinzel', serif; }

#snow-canvas {
  position: fixed;
  top: 0;
  left: 0;
  width: 100vw;
  height: 100vh;
  pointer-events: none;
  z-index: 0;
}

#root {
  position: relative;
  z-index: 10;
}

.glass-card {
  background: rgba(15, 23, 42, 0.78);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border: 1px solid rgba(56, 189, 248, 0.2);
}
.glass-card-active {
  border-color: rgba(56, 189, 248, 0.55);
  box-shadow: 0 0 25px rgba(56, 189, 248, 0.15);
}
.celebration-border {
  background: linear-gradient(135deg, #38bdf8, #818cf8, #c084fc, #38bdf8);
  background-size: 300% 300%;
  animation: gradientShift 6s ease infinite;
}
@keyframes gradientShift {
  0% { background-position: 0% 50%; }
  50% { background-position: 100% 50%; }
  100% { background-position: 0% 50%; }
}
::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-track { background: #082f49; }
::-webkit-scrollbar-thumb { background: #0284c7; border-radius: 4px; }
::-webkit-scrollbar-thumb:hover { background: #38bdf8; }

.goog-te-banner-frame.skiptranslate, 
.goog-te-banner-frame, 
iframe.goog-te-banner-frame,
.goog-te-balloon-frame {
  display: none !important;
  visibility: hidden !important;
  height: 0 !important;
}
body {
  top: 0px !important;
  position: static !important;
}
.skiptranslate iframe {
  display: none !important;
}
#google_translate_element {
  position: absolute;
  top: -9999px;
  left: -9999px;
  visibility: hidden;
}
  </style>
</head>
<body class="selection:bg-cyan-500 selection:text-white pb-20">
  <canvas id="snow-canvas"></canvas>
  <div id="google_translate_element"></div>
  <div id="root"></div>

  <script src="assets/app-7ca468e5a4.js"></script>
</body>
